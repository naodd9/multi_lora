[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-lora-moe"
version = "1.0.0"
description = "Multi-LoRA and Mixture-of-Experts adaptation of a frozen DistilBERT encoder for multi-task text classification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "For educational use only" }
keywords = ["lora", "mixture-of-experts", "peft", "distilbert", "multi-task", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Education",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.0.0",
    "peft>=0.4.0",
    "datasets>=2.0.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=5.0.0",
    "matplotlib>=3.0.0",
    "seaborn>=0.10.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

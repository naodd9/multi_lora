# Combined Multi-LoRA + MoE model configuration

model:
  # Model architecture
  name: "distilbert-base-uncased"
  dropout_rate: 0.1
  
  # Task-specific LoRA experts parameters
  task_specific_experts:
    num_experts_per_task: 2  # Number of LoRA experts per task
    lora:
      rank: 8
      alpha: 16
      dropout: 0.1
  
  # MoE specific parameters
  moe:
    num_experts: 4
    expert_capacity: 32
    k: 2  # Top-k gating
    load_balancing_loss_coeff: 0.01
  
  # Task-specific configuration
  tasks:
    ag_news:
      num_classes: 4
      class_names: ["World", "Sports", "Business", "Sci/Tech"]
    sst2:
      num_classes: 2
      class_names: ["negative", "positive"]
  
  # Whether to freeze the encoder (we freeze the base model and only train LoRA layers, router, and heads)
  freeze_encoder: true

# Training configuration
training:
  # Optimization
  optimizer: "adamw"
  learning_rate: 5e-5  # Balanced for combined model training
  weight_decay: 0.01
  
  # Learning rate schedule
  lr_scheduler: "linear"  # Linear warmup followed by linear decay
  warmup_steps: 500
  
  # Batch sizes
  batch_size:
    train: 16
    validation: 16
    test: 16
  
  # Training duration
  max_epochs: 3
  
  # Evaluation and logging
  eval_steps: 500
  log_steps: 100
  
  # Gradient clipping
  max_grad_norm: 1.0

# Output configuration
output:
  # Directory to save model checkpoints and logs
  checkpoint_dir: "./outputs/combined_moe/checkpoints"
  log_dir: "./outputs/combined_moe/logs"
  
  # Whether to save the best model based on validation performance
  save_best_only: true
  metric_for_best_model: "eval_accuracy"
  
  # Whether to push to Hugging Face Hub (requires token)
  push_to_hub: false
  hub_model_id: ""  # e.g., "username/combined-moe-model"

# Reproducibility
seed: 42

# Device configuration
device: "auto"  # Will use CUDA if available, otherwise CPU
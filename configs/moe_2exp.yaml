# MoE-LoRA model configuration (2 experts)

model:
  # Model architecture
  name: "distilbert-base-uncased"
  dropout_rate: 0.1
  
  # MoE specific parameters
  moe:
    num_experts: 2  # Stage 6: Standard MoLoRA with two experts
    expert_capacity: 32
    k: 1  # Top-1 gating for standard MoE (can also try k=2)
    load_balancing_loss_coeff: 0.01
  
  # LoRA specific parameters (applied to each expert)
  lora:
    rank: 8
    alpha: 16
    dropout: 0.1
    # Target modules for DistilBERT: attention and feed-forward layers
    target_modules: ["q_lin", "v_lin", "k_lin", "out_lin", "lin1", "lin2"]
  
  # Task-specific configuration
  tasks:
    ag_news:
      num_classes: 4
      class_names: ["World", "Sports", "Business", "Sci/Tech"]
    sst2:
      num_classes: 2
      class_names: ["negative", "positive"]
  
  # Whether to freeze the encoder (for MoE-LoRA, we freeze the base model and only train LoRA layers, router, and heads)
  freeze_encoder: true

# Training configuration
training:
  # Optimization
  optimizer: "adamw"
  learning_rate: 5e-5  # Balanced for MoE training
  weight_decay: 0.01
  
  # Learning rate schedule
  lr_scheduler: "linear"  # Linear warmup followed by linear decay
  warmup_steps: 500
  
  # Batch sizes
  batch_size:
    train: 16
    validation: 16
    test: 16
  
  # Training duration
  max_epochs: 3
  
  # Evaluation and logging
  eval_steps: 500
  log_steps: 100
  
  # Gradient clipping
  max_grad_norm: 1.0

# Output configuration
output:
  # Directory to save model checkpoints and logs
  checkpoint_dir: "./outputs/moe_2exp/checkpoints"
  log_dir: "./outputs/moe_2exp/logs"
  
  # Whether to save the best model based on validation performance
  save_best_only: true
  metric_for_best_model: "eval_accuracy"
  
  # Whether to push to Hugging Face Hub (requires token)
  push_to_hub: false
  hub_model_id: ""  # e.g., "username/moe-lora-2exp-model"

# Reproducibility
seed: 42

# Device configuration
device: "auto"  # Will use CUDA if available, otherwise CPU